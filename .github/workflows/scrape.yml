name: scrape

on:
  schedule:
    - cron: "*/30 * * * *"   # GitHub may delay scheduled runs by several minutes under load
  workflow_dispatch:

# Never run two scrapes at once (they would race on the data commit).
concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # to start the deploy workflow after a data commit

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements*.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Scrape
        working-directory: scraper
        # Headlines only: no ML, no API keys, no secrets.
        run: python -m apnews.run

      - name: Commit data
        run: |
          git config user.name  "apnews-bot"
          git config user.email "apnews-bot@users.noreply.github.com"
          git add web/public/data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: scrape $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          # Pushes made with GITHUB_TOKEN don't trigger deploy.yml, so start it explicitly.
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}
